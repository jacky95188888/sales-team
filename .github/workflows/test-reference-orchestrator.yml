name: Test Reference Orchestrator

on:
  push:
    branches: [video-quality-v3-clean]
    paths:
      - sales-team-worker.js
      - scripts/test-reference-orchestrator.mjs
      - .github/workflows/test-reference-orchestrator.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: video-quality-v3-clean
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check sales-team-worker.js
          node --check scripts/test-reference-orchestrator.mjs
      - name: Reference runtime tests
        run: node scripts/test-reference-orchestrator.mjs

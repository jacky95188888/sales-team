name: Video Quality V2

on:
  push:
    branches: ["upgrade/video-quality-v2"]
  pull_request:
    paths:
      - "video-quality-v2.js"
      - "scripts/test-video-quality-v2.mjs"
      - ".github/workflows/video-quality-v2.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:video-quality-v2

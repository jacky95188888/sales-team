name: Inspect AI Eyes test prerequisites

on:
  push:
    branches: [codex/ai-eyes-v341-test-deploy]
    paths:
      - .github/workflows/inspect-ai-eyes-v341.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Report availability without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_EYES_ACCESS_TOKEN: ${{ secrets.AI_EYES_ACCESS_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'cloudflare_token=missing'; exit 1
          fi
          if [ -n "$GEMINI_API_KEY" ]; then echo 'github_gemini_key=present'; else echo 'github_gemini_key=missing'; fi
          if [ -n "$AI_EYES_ACCESS_TOKEN" ]; then echo 'github_ai_eyes_access_token=present'; else echo 'github_ai_eyes_access_token=missing'; fi
          status=$(curl --silent --show-error --output cf-result.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/accounts/22bd6a71b50e9eeaa0daa802615a3459/workers/scripts/ai-eyes-video/secrets')
          echo "existing_ai_eyes_metadata_http=$status"
          if [ "$status" = 200 ] && jq -e '.success == true and (.result | type == "array")' cf-result.json >/dev/null; then
            jq -r '"existing_ai_eyes_gemini_key=" + (if any(.result[]; .name == "GEMINI_API_KEY") then "present" else "missing" end),
                   "existing_ai_eyes_access_token=" + (if any(.result[]; .name == "ACCESS_TOKEN") then "present" else "missing" end)' cf-result.json
          fi
          rm -f cf-result.json

name: Deploy Sales Team Worker

on:
  push:
    branches:
      - main
    paths:
      - sales-team-worker.js
      - hq-patch.js
      - wrangler.jsonc
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to update the production Worker
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sales-team-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source and configuration
        run: |
          node --check sales-team-worker.js
          node scripts/check-worker.mjs

      - name: Require protected credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"

      - name: Deploy Worker and sync publisher Secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 22bd6a71b50e9eeaa0daa802615a3459
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc
          secrets: |
            YOUTUBE_CLIENT_ID
            YOUTUBE_CLIENT_SECRET
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

      - name: Verify public Worker endpoint and approval gate
        run: |
          base='https://sales-team.rhtm9y855y.workers.dev'

          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --header 'Origin: https://jacky95188888.github.io' \
            "$base/monitor-notes")
          test "$status" = "200"
          jq -e 'has("notes")' response.json >/dev/null

          # Production safety smoke test: protected Threads routes must reject
          # requests that do not carry the human approval PIN.
          # A newly deployed Worker can take a few seconds to become visible at every edge.
          # Retry the whole approval-gate probe before declaring production verification failed.
          verified=0
          for attempt in 1 2 3 4 5 6; do
            ok=1
            for route in status config research research-now draft drafts approve publish; do
              status=$(curl --silent --show-error --output "gate-$route.json" --write-out '%{http_code}' \
                --request POST \
                --header 'Origin: https://jacky95188888.github.io' \
                --header 'Content-Type: application/json' \
                --data '{}' \
                "$base/threads-growth/$route")
              if [ "$status" != "401" ] || ! jq -e '.error == "APPROVAL_UNAUTHORIZED"' "gate-$route.json" >/dev/null; then
                ok=0
                echo "attempt=$attempt route=$route status=$status"
                cat "gate-$route.json"
                break
              fi
            done
            if [ "$ok" = "1" ]; then verified=1; break; fi
            sleep 5
          done
          test "$verified" = "1"
